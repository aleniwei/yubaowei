  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
 </defs>
 <rect x="0" y="0" width="640" height="580" rx="32" fill="url(#g)"/>
 <g opacity=".5" fill="none" stroke="#759d92"><circle cx="319" cy="285" r="224" stroke-width="1" stroke-dasharray="3 9"/><circle cx="319" cy="285" r="175" stroke-width="1"/><circle cx="319" cy="285" r="118" stroke-width="1" stroke-dasharray="2 7"/></g>
 <path d="M100 405 C190 455 248 356 324 315 S468 197 538 151" fill="none" stroke="#2e665b" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="6 10"/>
