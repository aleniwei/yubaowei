 <g transform="translate(310 320)"><circle r="78" fill="#528b7a" opacity=".19" filter="url(#shadow)"/><circle r="72" fill="#e6f1e8" stroke="#568b7e" stroke-width="3"/><path d="M310 248V392" stroke="#6c9d8e" stroke-width="2"/><g fill="url(#c)" stroke="#85aca0" stroke-width="2"><circle cx="278" cy="320" r="31"/><circle cx="342" cy="320" r="31"/></g><circle cx="278" cy="320" r="9" fill="#83aa9c"/><circle cx="342" cy="320" r="9" fill="#83aa9c"/></g>
