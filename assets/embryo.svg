<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" aria-labelledby="title desc">
 <title id="title">From a single cell to a developing embryo</title>
 <desc id="desc">An abstract scientific illustration of early embryo cleavage stages, connected by a curved trajectory.</desc>
