<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <meta name="description" content="{{ if .Params.subtitle }}{{ .Params.subtitle }}{{ else }}{{ .Title }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body class="page-{{ .Params.nav | default "home" }}">
  <header class="site-header">
    <nav class="site-nav" aria-label="Primary navigation">
      {{ $active := .Params.nav | default "home" }}
      {{ range site.Menus.main }}
      <a href="{{ .URL }}" class="nav-link{{ if eq .Identifier $active }} is-current{{ end }}"{{ if eq .Identifier $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </header>
  {{ block "main" . }}{{ end }}
  <div class="reading-progress" aria-hidden="true"><span class="reading-progress-fill"></span></div>
  <script src="{{ "js/site.js" | relURL }}" defer></script>
</body>
</html>
